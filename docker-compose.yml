# 开发/部署编排：Milvus 向量库三件套 + 后端 + 前端（M6 完整 Docker 栈）。
#
# 用法:
#   docker compose up -d              # 启动向量库（本地开发先只跑这套）
#   docker compose --profile app up -d  # + 后端 + 前端（完整栈）
#   docker compose down -v            # 停止并清空数据
#
# 说明: Milvus 2.4+ 的独立部署需要 etcd(元数据) + minio(存储) + milvus(计算)
# 三个服务。向量数据真正存在 minio, 元数据在 etcd。
# app profile 加入后：前端 nginx :8080 → 后端 :8000 → Milvus。

services:
  mailpit:
    image: axllent/mailpit:v1.21
    container_name: bartenderai-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

  etcd:
    image: quay.io/coreos/etcd:v3.5.14
    container_name: milvus-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
    volumes:
      - ./volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: milvus-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - ./volumes/minio:/minio_data
    command: minio server /minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.4.13
    container_name: milvus-standalone
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ./volumes/milvus:/var/lib/milvus
    ports:
      - "19530:19530"   # SDK 连接端口
      - "9091:9091"     # 健康检查/metrics
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3

  # ---- 应用层（--profile app 启用）----
  backend:
    profiles: ["app"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bartenderai-backend
    env_file:
      - ./backend/.env          # LLM key / 安全配置（不进镜像，运行时注入）
    environment:
      MILVUS_HOST: milvus
      MILVUS_PORT: "19530"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      FRONTEND_URL: http://localhost:8080
      CORS_ORIGINS: http://localhost:8080
      ENV: "${ENV:-dev}"
    volumes:
      - ./volumes/models:/app/models        # bge 模型持久化（首次自动下载）
      - ./volumes/data:/app/data            # SQLite + 审计日志持久化
    ports:
      - "8000:8000"
    depends_on:
      milvus:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    # 注：LLM API Key 通过环境变量注入（构建时不进镜像）：
    #   docker compose --profile app up -d -e QWEN_API_KEY=sk-...

  frontend:
    profiles: ["app"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bartenderai-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
